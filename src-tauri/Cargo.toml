[package]
name = "atlas-tracker"
version = "0.1.1"
description = "Circana Interactions Tracker"
authors = ["Christian Mora Lopez"]
edition = "2021"

[lib]
name = "atlas_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
umya-spreadsheet = "2.3"
quick-xml = "0.37"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
open = "5"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
regex = "1"
html-escape = "0.2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
