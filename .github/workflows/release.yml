name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      CIRCANA_AZURE_CLIENT_ID: ${{ vars.CIRCANA_AZURE_CLIENT_ID }}
      CIRCANA_AZURE_TENANT_ID: ${{ vars.CIRCANA_AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Entra build configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CIRCANA_AZURE_CLIENT_ID)) {
            throw "Set the CIRCANA_AZURE_CLIENT_ID repository variable before publishing a release."
          }
          if ([string]::IsNullOrWhiteSpace($env:CIRCANA_AZURE_TENANT_ID)) {
            throw "Set the CIRCANA_AZURE_TENANT_ID repository variable before publishing a release."
          }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Build portable Windows executable
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle
      - name: Package portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/atlas-tracker.exe -Destination portable/Atlas.exe
          Copy-Item -LiteralPath docs/PORTABLE_README.md -Destination portable/README.md
          Compress-Archive -Path portable/* -DestinationPath "Atlas_${{ github.ref_name }}_portable_windows_x64.zip"
      - name: Publish portable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlas_${{ github.ref_name }}_portable_windows_x64.zip
          name: Atlas ${{ github.ref_name }}
          body: Download the portable Windows zip, extract it, and run Atlas.exe. No installer is required.
          fail_on_unmatched_files: true
