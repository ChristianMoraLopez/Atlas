name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CIRCANA_AZURE_CLIENT_ID: ${{ vars.CIRCANA_AZURE_CLIENT_ID }}
      CIRCANA_AZURE_TENANT_ID: ${{ vars.CIRCANA_AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
      - name: Restore bundled Local AI cache
        uses: actions/cache@v4
        with:
          path: .atlas-ai-cache
          key: atlas-ai-windows-x64-ollama-0.30.8-qwen2.5-1.5b-q4km
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and verify the Windows installer
        id: package
        shell: pwsh
        run: .github/scripts/build-installer.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/${{ steps.package.outputs.installer }}
            release-output/SHA256SUMS.txt
          name: Atlas ${{ github.ref_name }}
          body: Download the Windows setup, run it and open Atlas from the Start menu or the desktop shortcut. It installs only for your Windows user (no administrator rights) and includes the CPU-only Ollama runtime and the Qwen2.5 model; no separate AI installation is required. If you used the portable folder before, delete it after installing; your settings are kept.
          fail_on_unmatched_files: true
