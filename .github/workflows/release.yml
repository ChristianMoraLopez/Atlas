name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CIRCANA_AZURE_CLIENT_ID: ${{ vars.CIRCANA_AZURE_CLIENT_ID }}
      CIRCANA_AZURE_TENANT_ID: ${{ vars.CIRCANA_AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
      - name: Restore bundled Local AI cache
        uses: actions/cache@v4
        with:
          path: .atlas-ai-cache
          key: atlas-ai-windows-x64-ollama-0.30.8-qwen2.5-1.5b-q4km
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build portable Windows executable
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle
      - name: Package portable executable
        shell: pwsh
        run: |
          .github/scripts/package-portable.ps1 -AtlasExecutable src-tauri/target/release/atlas-tracker.exe -ArchiveName "Atlas_${{ github.ref_name }}_portable_windows_x64.zip"
      - name: Publish portable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/Atlas_${{ github.ref_name }}_portable_windows_x64.zip
            release-output/SHA256SUMS.txt
          name: Atlas ${{ github.ref_name }}
          body: Download the portable Windows zip, extract the complete folder, and run Atlas.exe. The managed CPU-only Ollama runtime and Qwen2.5 model are included; no separate AI installation is required.
          fail_on_unmatched_files: true
