name: Build Atlas Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Portable Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CIRCANA_AZURE_CLIENT_ID: ${{ vars.CIRCANA_AZURE_CLIENT_ID }}
      CIRCANA_AZURE_TENANT_ID: ${{ vars.CIRCANA_AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
      - name: Restore bundled Local AI cache
        uses: actions/cache@v4
        with:
          path: .atlas-ai-cache
          key: atlas-ai-windows-x64-ollama-0.30.8-qwen2.5-1.5b-q4km
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build portable Windows executable
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle
      - name: Package and verify portable ZIP
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $archive = "Atlas-$version-Windows-x64.zip"
          .github/scripts/package-portable.ps1 -AtlasExecutable src-tauri/target/release/atlas-tracker.exe -ArchiveName $archive
          "artifact=Atlas-$version-Windows-x64" >> $env:GITHUB_OUTPUT
      - name: Upload Atlas portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
