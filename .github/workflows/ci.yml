name: Build Atlas Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CIRCANA_AZURE_CLIENT_ID: ${{ vars.CIRCANA_AZURE_CLIENT_ID }}
      CIRCANA_AZURE_TENANT_ID: ${{ vars.CIRCANA_AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
      - name: Restore bundled Local AI cache
        uses: actions/cache@v4
        with:
          path: .atlas-ai-cache
          key: atlas-ai-windows-x64-ollama-0.30.8-qwen2.5-1.5b-q4km
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and verify the Windows installer
        id: package
        shell: pwsh
        run: .github/scripts/build-installer.ps1
      - name: Upload Atlas installer
        uses: actions/upload-artifact@v6
        with:
          name: Atlas-Windows-x64-Setup
          path: release-output/
          if-no-files-found: error
